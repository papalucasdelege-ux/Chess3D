<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191e27" />
      <stop offset="100%" stop-color="#0d1016" />
    </linearGradient>
    <linearGradient id="woodLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c79d" />
      <stop offset="100%" stop-color="#b89464" />
    </linearGradient>
    <linearGradient id="woodDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b4228" />
      <stop offset="100%" stop-color="#3f2414" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <!-- Subtle checkered hardwood diamond emblem -->
  <g transform="translate(256 266)">
    <rect x="-152" y="-152" width="152" height="152" rx="14" fill="url(#woodLight)" opacity="0.16" />
    <rect x="0" y="0" width="152" height="152" rx="14" fill="url(#woodLight)" opacity="0.16" />
    <rect x="0" y="-152" width="152" height="152" rx="14" fill="url(#woodDark)" opacity="0.32" />
    <rect x="-152" y="0" width="152" height="152" rx="14" fill="url(#woodDark)" opacity="0.32" />
  </g>
  <!-- Carved Staunton King Silhouette -->
  <g fill="url(#woodLight)" stroke="#24150c" stroke-width="6" stroke-linejoin="round">
    <!-- Flared Cross Pattee -->
    <path d="M244 82 h24 l-4 32 h30 v24 l-30 -4 l4 30 h-24 l4 -30 l-30 4 v-24 h30 z" />
    <!-- Imperial Bell Crown -->
    <path d="M196 184 c18 -18 42 -26 60 -26 s42 8 60 26 l-16 58 h-88 z" />
    <!-- Flared Collar -->
    <rect x="196" y="242" width="120" height="22" rx="11" />
    <!-- Baluster Column -->
    <path d="M214 264 h84 c-10 42 4 86 24 114 h-132 c20 -28 34 -72 24 -114 z" />
    <!-- Turned Pedestal Base -->
    <rect x="166" y="378" width="180" height="24" rx="10" />
    <rect x="150" y="402" width="212" height="28" rx="10" />
  </g>
